<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Food</title>

    <link rel="stylesheet" th:href="@{/style/style.css}">
</head>

<body>

<div class="container">

    <div class="intro">
        <div class="tag">Food Management System</div>

        <h1>
            Add your<br>
            <span>next dish.</span>
        </h1>

        <p>
            Manage your food inventory with a simple
            Spring Boot and Thymeleaf interface.
            Add dishes, set their prices and control
            their availability.
        </p>
    </div>


    <div class="card">

        <h2>Add Food</h2>

        <p class="card-subtitle">
            Enter the details of the new food item.
        </p>

        <form action="/food/add" method="post">

            <div class="field">
                <label for="foodName">Food Name</label>
                <input
                        type="text"
                        id="foodName"
                        name="foodName"
                        placeholder="e.g. Chicken Biryani"
                        required>
            </div>

            <div class="field">
                <label for="price">Price</label>
                <input
                        type="number"
                        id="price"
                        name="price"
                        placeholder="e.g. 180"
                        step="0.01"
                        required>
            </div>

            <div class="field availability">
                <label for="isAvailable">Available for ordering</label>

                <input
                        type="checkbox"
                        id="isAvailable"
                        name="isAvailable">
            </div>

            <button type="submit">
                Add Food
            </button>

        </form>

        <a href="/foods" class="view-btn">View Foods</a>

        <div class="footer">
            Powered by Spring Boot · Spring Data JPA · Thymeleaf
        </div>

    </div>
</div>

</body>

</html>
